# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The "npm" ecosystem also covers pnpm (pnpm-lock.yaml).
  # Note: Dependabot does not edit the `overrides` in pnpm-workspace.yaml. The
  # `vite` override there must track the Vite major that Astro depends on, so
  # Astro major bumps may need that override updated by hand.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    # Let fresh releases settle before proposing them.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    # Packages that must move together share a PR; the first matching group wins.
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # Everything else: batch minor/patch bumps; majors still get their own PR.
      # Exclude the groups above explicitly so their packages never split off here.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "astro"
          - "@astrojs/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
